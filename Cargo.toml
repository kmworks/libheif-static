[package]
name = "libheif-sys"
# Matches the upstream release this replaces through `[patch.crates-io]`.
version = "5.3.1+1.23.1"
edition = "2021"
build = "build.rs"
links = "heif"
description = "libheif bindings that link prebuilt static libheif, libde265 and dav1d"
license = "MIT"
repository = "https://github.com/kmworks/libheif-static"
publish = false
exclude = [".github", "triplets", "licenses", "vcpkg.commit"]

[features]
# Upstream's feature names: libheif-rs refers to them.
embedded-libheif = []
use-bindgen = ["latest"]
latest = ["v1_23"]
v1_17 = []
v1_18 = []
v1_19 = []
v1_20 = []
v1_21 = []
v1_23 = []

[dependencies]
cfg-if = "1.0"
libc = "0.2"

[build-dependencies]
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
